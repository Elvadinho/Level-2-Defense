<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Attendance</title>

        <!-- React, ReactDOM, Babel, and Scanner -->
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <script src="https://unpkg.com/html5-qrcode"></script>
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Native iOS / WhatsApp Styling -->
        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "SF Pro Text",
                    "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: #f2f2f7; /* iOS System Gray 6 */
                color: #000000;
                margin: 0;
                padding: 0;
                -webkit-font-smoothing: antialiased;
            }
            .ios-header {
                background-color: rgba(246, 246, 246, 0.85);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-bottom: 0.5px solid rgba(0, 0, 0, 0.15);
                position: sticky;
                top: 0;
                z-index: 50;
                height: 44px;
            }
            .ios-list-group {
                background-color: #ffffff;
                border-top: 0.5px solid #c6c6c8;
                border-bottom: 0.5px solid #c6c6c8;
            }
            .ios-list-item {
                border-bottom: 0.5px solid #c6c6c8;
                margin-left: 16px;
                padding: 11px 16px 11px 0;
                display: flex;
                align-items: center;
            }
            .ios-list-item:last-child {
                border-bottom: none;
            }
            .ios-input {
                width: 100%;
                border: none;
                outline: none;
                font-size: 17px;
                background: transparent;
            }
            .ios-input::placeholder {
                color: #3c3c434d;
            }
            /* iOS Segmented Control */
            .ios-segment-bg {
                background-color: #e3e3e8;
                padding: 2px;
                border-radius: 8px;
            }
            .ios-segment-btn {
                font-size: 13px;
                font-weight: 600;
                border-radius: 6.5px;
                padding: 5px 0;
                text-align: center;
                transition: all 0.2s;
            }
            .ios-segment-active {
                background-color: #ffffff;
                box-shadow:
                    0 3px 8px rgba(0, 0, 0, 0.12),
                    0 3px 1px rgba(0, 0, 0, 0.04);
                color: #000000;
            }
            .ios-segment-inactive {
                color: #000000;
            }
            /* Native Buttons */
            .ios-button {
                font-size: 17px;
                font-weight: 600;
                border-radius: 12px;
                padding: 14px;
                text-align: center;
                width: 100%;
                border: none;
                cursor: pointer;
                transition: opacity 0.2s;
            }
            .ios-button:active {
                opacity: 0.7;
            }
            .ios-button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .ios-button-blue {
                background-color: #007aff;
                color: white;
            }
            .ios-button-green {
                background-color: #34c759;
                color: white;
            }
            .ios-button-red {
                background-color: #ff3b30;
                color: white;
            }

            /* Clean up HTML5-QRCode Scanner UI */
            #reader {
                border: none !important;
                border-radius: 12px;
                overflow: hidden;
                background: #000;
            }
            #reader__dashboard_section_csr span a {
                display: none !important;
            }
        </style>
    </head>

    <body>
        <div id="root" class="w-full max-w-md mx-auto min-h-screen pb-12"></div>

        <script type="text/babel">
            const { useState, useEffect } = React;

            function AttendanceTester() {
                const [token, setToken] = useState("");
                const [view, setView] = useState("employee");

                const [location, setLocation] = useState(null);
                const [statusMessage, setStatusMessage] = useState("");
                const [statusType, setStatusType] = useState("");
                const [loading, setLoading] = useState(false);

                const [scannerActive, setScannerActive] = useState(false);
                const [actionType, setActionType] = useState("");
                const [qrCodeSvg, setQrCodeSvg] = useState("");

                useEffect(() => {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                setLocation({
                                    lat: position.coords.latitude,
                                    lng: position.coords.longitude,
                                });
                            },
                            (error) => {
                                setStatusMessage(
                                    "Please allow location permissions in settings.",
                                );
                                setStatusType("error");
                            },
                        );
                    } else {
                        setStatusMessage("Geolocation is not supported.");
                        setStatusType("error");
                    }
                }, []);

                useEffect(() => {
                    let html5QrcodeScanner = null;

                    if (scannerActive && view === "employee") {
                        html5QrcodeScanner = new Html5QrcodeScanner(
                            "reader",
                            { fps: 10, qrbox: { width: 250, height: 250 } },
                            false,
                        );

                        html5QrcodeScanner.render(
                            (decodedText) => {
                                if (
                                    decodedText === "modoo-office-secure-token"
                                ) {
                                    html5QrcodeScanner.clear();
                                    setScannerActive(false);
                                    sendCheckInRequest(actionType);
                                } else {
                                    setStatusMessage("Invalid QR Code.");
                                    setStatusType("error");
                                }
                            },
                            (errorMessage) => {},
                        );
                    }

                    return () => {
                        if (html5QrcodeScanner) {
                            html5QrcodeScanner
                                .clear()
                                .catch((e) => console.error(e));
                        }
                    };
                }, [scannerActive, view, actionType, location, token]);

                const sendCheckInRequest = async (endpoint) => {
                    if (!token)
                        return alert("Please enter your Sanctum token first.");
                    if (!location) return alert("Waiting for GPS location...");

                    setLoading(true);
                    setStatusMessage("Connecting...");
                    setStatusType("loading");

                    try {
                        const response = await fetch(
                            `http://192.168.1.203:8000/api/attendance/${endpoint}`,
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    Accept: "application/json",
                                    Authorization: `Bearer ${token}`,
                                },
                                body: JSON.stringify({
                                    latitude: location.lat,
                                    longitude: location.lng,
                                }),
                            },
                        );

                        const data = await response.json();

                        if (response.ok) {
                            setStatusMessage(data.message);
                            setStatusType("success");
                        } else {
                            setStatusMessage(data.message);
                            setStatusType("error");
                        }
                    } catch (error) {
                        setStatusMessage(
                            "Network Error. Please check your connection.",
                        );
                        setStatusType("error");
                    }
                    setLoading(false);
                };

                const fetchQrCode = async () => {
                    if (!token)
                        return alert("Please enter an Admin token first.");
                    setLoading(true);
                    setQrCodeSvg("");
                    setStatusMessage("");

                    try {
                        const response = await fetch(
                            `http://192.168.1.203:8000/api/attendance/qr-code`,
                            {
                                method: "GET",
                                headers: {
                                    Accept: "image/svg+xml",
                                    Authorization: `Bearer ${token}`,
                                },
                            },
                        );

                        if (response.ok) {
                            const svgText = await response.text();
                            setQrCodeSvg(svgText);
                        } else {
                            const data = await response.json();
                            alert(data.message);
                        }
                    } catch (error) {
                        alert("Network Error. Please check your connection.");
                    }
                    setLoading(false);
                };

                const startScanner = (type) => {
                    if (!token)
                        return alert("Please enter your Sanctum token first.");
                    setActionType(type);
                    setScannerActive(true);
                    setStatusMessage("");
                };

                return (
                    <div>
                        {/* iOS Native Header */}
                        <div className="ios-header flex items-center justify-center">
                            <h1 className="text-[17px] font-semibold tracking-tight">
                                Attendance
                            </h1>
                        </div>

                        {/* iOS Segmented Control (Tabs) */}
                        <div className="px-4 py-3">
                            <div className="ios-segment-bg flex">
                                <button
                                    onClick={() => {
                                        setView("employee");
                                        setScannerActive(false);
                                        setStatusMessage("");
                                    }}
                                    className={`flex-1 ios-segment-btn ${view === "employee" ? "ios-segment-active" : "ios-segment-inactive"}`}
                                >
                                    Employee
                                </button>
                                <button
                                    onClick={() => {
                                        setView("admin");
                                        setScannerActive(false);
                                        setStatusMessage("");
                                        setQrCodeSvg("");
                                    }}
                                    className={`flex-1 ios-segment-btn ${view === "admin" ? "ios-segment-active" : "ios-segment-inactive"}`}
                                >
                                    Admin
                                </button>
                            </div>
                        </div>

                        {/* iOS Settings Group 1: Authentication */}
                        <div className="text-[13px] text-gray-500 uppercase px-4 mb-1.5 mt-2 tracking-wide">
                            Authentication
                        </div>
                        <div className="ios-list-group">
                            <div className="ios-list-item">
                                <span className="w-[100px] text-[17px]">
                                    Token
                                </span>
                                <input
                                    type="text"
                                    value={token}
                                    onChange={(e) => setToken(e.target.value)}
                                    placeholder="Paste Bearer Token"
                                    className="ios-input"
                                />
                            </div>
                        </div>

                        {/* EMPLOYEE VIEW */}
                        {view === "employee" && (
                            <div className="animate-fade-in">
                                {/* iOS Settings Group 2: Location Status */}
                                <div className="text-[13px] text-gray-500 uppercase px-4 mb-1.5 mt-8 tracking-wide">
                                    Device Status
                                </div>
                                <div className="ios-list-group">
                                    <div className="ios-list-item pr-4">
                                        <span className="flex-1 text-[17px]">
                                            Location Services
                                        </span>
                                        {location ? (
                                            <span className="text-gray-500 text-[17px]">
                                                {location.lat.toFixed(4)},{" "}
                                                {location.lng.toFixed(4)}
                                            </span>
                                        ) : (
                                            <span className="text-gray-400 text-[17px]">
                                                Locating...
                                            </span>
                                        )}
                                    </div>
                                </div>

                                {/* Status Feedback Text (under list) */}
                                {statusMessage && (
                                    <p
                                        className={`px-4 mt-2 text-[13px] text-center ${statusType === "error" ? "text-[#FF3B30]" : "text-gray-500"}`}
                                    >
                                        {statusMessage}
                                    </p>
                                )}

                                {/* Action Buttons */}
                                <div className="px-4 mt-8">
                                    {scannerActive ? (
                                        <div className="animate-fade-in">
                                            <div
                                                id="reader"
                                                className="shadow-sm mb-4 border border-[#E5E5EA]"
                                            ></div>
                                            <button
                                                onClick={() =>
                                                    setScannerActive(false)
                                                }
                                                className="ios-button ios-button-red"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-3">
                                            <button
                                                onClick={() =>
                                                    startScanner("check-in")
                                                }
                                                disabled={loading || !location}
                                                className="ios-button ios-button-blue"
                                            >
                                                Scan to Check In
                                            </button>
                                            <button
                                                onClick={() =>
                                                    startScanner("check-out")
                                                }
                                                disabled={loading || !location}
                                                className="ios-button ios-button-green"
                                            >
                                                Scan to Check Out
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ADMIN VIEW */}
                        {view === "admin" && (
                            <div className="animate-fade-in">
                                <div className="px-4 mt-8">
                                    <button
                                        onClick={fetchQrCode}
                                        disabled={loading}
                                        className="ios-button ios-button-blue"
                                    >
                                        {loading
                                            ? "Generating..."
                                            : "Generate Office QR"}
                                    </button>

                                    {qrCodeSvg && (
                                        <div className="mt-8 flex flex-col items-center animate-fade-in">
                                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-[#C6C6C8]">
                                                <div
                                                    className="rounded-xl overflow-hidden flex"
                                                    dangerouslySetInnerHTML={{
                                                        __html: qrCodeSvg,
                                                    }}
                                                />
                                            </div>
                                            <span className="mt-4 text-[13px] text-gray-500">
                                                Print and display at entrance.
                                            </span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(<AttendanceTester />);
        </script>
    </body>
</html>
