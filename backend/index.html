<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SGA Modoo - Attendance Gateway</title>

        <!-- Google Fonts: Outfit -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <!-- React, ReactDOM, Babel, and Scanner -->
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <script src="https://unpkg.com/html5-qrcode"></script>

        <!-- Tailwind CSS & Custom Theme Config -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ["Outfit", "sans-serif"] },
                        colors: {
                            brand: {
                                blue: "#0066cc",
                                blueDark: "#004d99",
                                green: "#00b359",
                                greenDark: "#008040",
                            },
                        },
                        animation: {
                            float: "float 8s ease-in-out infinite",
                        },
                        keyframes: {
                            float: {
                                "0%, 100%": {
                                    transform: "translateY(0) scale(1)",
                                },
                                "50%": {
                                    transform: "translateY(-20px) scale(1.05)",
                                },
                            },
                        },
                    },
                },
            };
        </script>

        <!-- Custom CSS for Glassmorphism & Scanner Tweaks -->
        <style>
            body {
                font-family: "Outfit", sans-serif;
            }

            .glass-card {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.6);
            }

            .animate-fade-in {
                animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Clean up the HTML5-QRCode Scanner UI */
            #reader {
                border: none !important;
                border-radius: 1rem;
                overflow: hidden;
                background: #f3f4f6;
            }
            #reader__dashboard_section_csr span a {
                display: none !important;
            }
            #reader button {
                background-color: #0066cc;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 12px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                font-family: "Outfit", sans-serif;
            }
            #reader button:hover {
                background-color: #004d99;
                transform: translateY(-1px);
            }
            #reader select {
                padding: 8px;
                border-radius: 8px;
                border: 1px solid #e5e7eb;
                outline: none;
            }
        </style>
    </head>

    <body
        class="bg-gradient-to-br from-brand-blue via-[#0088cc] to-brand-green min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
    >
        <!-- Dynamic Background Orbs -->
        <div
            class="absolute top-[-15%] left-[-10%] w-[500px] h-[500px] bg-white/20 rounded-full blur-[80px] animate-float pointer-events-none"
        ></div>
        <div
            class="absolute bottom-[-15%] right-[-10%] w-[500px] h-[500px] bg-brand-green/30 rounded-full blur-[80px] animate-float pointer-events-none"
            style="animation-delay: 2.5s"
        ></div>

        <div id="root" class="relative z-10 w-full max-w-[420px]"></div>

        <script type="text/babel">
            const { useState, useEffect } = React;

            function AttendanceTester() {
                const [token, setToken] = useState("");
                const [view, setView] = useState("employee");

                const [location, setLocation] = useState(null);
                const [statusMessage, setStatusMessage] = useState("");
                const [statusType, setStatusType] = useState("");
                const [loading, setLoading] = useState(false);

                const [scannerActive, setScannerActive] = useState(false);
                const [actionType, setActionType] = useState("");
                const [qrCodeSvg, setQrCodeSvg] = useState("");

                useEffect(() => {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                setLocation({
                                    lat: position.coords.latitude,
                                    lng: position.coords.longitude,
                                });
                            },
                            (error) => {
                                setStatusMessage(
                                    "Please allow location permissions.",
                                );
                                setStatusType("error");
                            },
                        );
                    } else {
                        setStatusMessage("Geolocation is not supported.");
                        setStatusType("error");
                    }
                }, []);

                useEffect(() => {
                    let html5QrcodeScanner = null;

                    if (scannerActive && view === "employee") {
                        html5QrcodeScanner = new Html5QrcodeScanner(
                            "reader",
                            { fps: 10, qrbox: { width: 250, height: 250 } },
                            false,
                        );

                        html5QrcodeScanner.render(
                            (decodedText) => {
                                if (
                                    decodedText === "modoo-office-secure-token"
                                ) {
                                    html5QrcodeScanner.clear();
                                    setScannerActive(false);
                                    sendCheckInRequest(actionType);
                                } else {
                                    setStatusMessage("Invalid Office QR Code!");
                                    setStatusType("error");
                                }
                            },
                            (errorMessage) => {},
                        );
                    }

                    return () => {
                        if (html5QrcodeScanner) {
                            html5QrcodeScanner
                                .clear()
                                .catch((e) => console.error(e));
                        }
                    };
                }, [scannerActive, view, actionType, location, token]);

                const sendCheckInRequest = async (endpoint) => {
                    if (!token)
                        return alert("Please enter your Sanctum token first!");
                    if (!location) return alert("Waiting for GPS location...");

                    setLoading(true);
                    setStatusMessage(`Submitting your ${endpoint}...`);
                    setStatusType("loading");

                    try {
                        const response = await fetch(
                            `http://192.168.1.203:8000/api/attendance/${endpoint}`,
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    Accept: "application/json",
                                    Authorization: `Bearer ${token}`,
                                },
                                body: JSON.stringify({
                                    latitude: location.lat,
                                    longitude: location.lng,
                                }),
                            },
                        );

                        const data = await response.json();

                        if (response.ok) {
                            setStatusMessage(data.message);
                            setStatusType("success");
                        } else {
                            setStatusMessage(data.message);
                            setStatusType("error");
                        }
                    } catch (error) {
                        setStatusMessage("Network Error. Is Laravel running?");
                        setStatusType("error");
                    }
                    setLoading(false);
                };

                const fetchQrCode = async () => {
                    if (!token)
                        return alert("Please enter an Admin token first!");
                    setLoading(true);
                    setQrCodeSvg("");
                    setStatusMessage("");

                    try {
                        const response = await fetch(
                            `http://192.168.1.203:8000/api/attendance/qr-code`,
                            {
                                method: "GET",
                                headers: {
                                    Accept: "image/svg+xml",
                                    Authorization: `Bearer ${token}`,
                                },
                            },
                        );

                        if (response.ok) {
                            const svgText = await response.text();
                            setQrCodeSvg(svgText);
                        } else {
                            const data = await response.json();
                            alert(data.message);
                        }
                    } catch (error) {
                        alert("Network Error. Is Laravel running?");
                    }
                    setLoading(false);
                };

                const startScanner = (type) => {
                    if (!token)
                        return alert("Please enter your Sanctum token first!");
                    setActionType(type);
                    setScannerActive(true);
                    setStatusMessage("");
                };

                // Dynamic Status Banner Component
                const StatusBanner = () => {
                    if (!statusMessage) return null;
                    const bgClass =
                        statusType === "success"
                            ? "bg-green-50 text-brand-greenDark border-green-200"
                            : statusType === "error"
                              ? "bg-red-50 text-red-700 border-red-200"
                              : "bg-blue-50 text-brand-blue border-blue-200";
                    const icon =
                        statusType === "success"
                            ? "✅"
                            : statusType === "error"
                              ? "⚠️"
                              : "🔄";

                    return (
                        <div
                            className={`mt-6 p-4 rounded-2xl border flex items-center justify-center gap-2 text-sm font-bold animate-fade-in shadow-sm ${bgClass}`}
                        >
                            <span>{icon}</span>
                            <span>{statusMessage}</span>
                        </div>
                    );
                };

                return (
                    <div className="glass-card p-8 rounded-[2.5rem] w-full shadow-2xl relative overflow-hidden">
                        {/* Decorative Top Accent */}
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-blue to-brand-green"></div>

                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brand-blue to-brand-green tracking-tight mb-2">
                                SGA Modoo
                            </h1>
                            <p className="text-gray-500 font-medium text-sm tracking-wide uppercase">
                                Enterprise Attendance
                            </p>
                        </div>

                        {/* Animated View Switcher Tabs */}
                        <div className="flex bg-gray-100 p-1.5 rounded-full mb-8 relative shadow-inner">
                            <button
                                onClick={() => {
                                    setView("employee");
                                    setScannerActive(false);
                                    setStatusMessage("");
                                }}
                                className={`flex-1 py-2.5 rounded-full text-sm font-bold transition-all duration-300 z-10 ${view === "employee" ? "text-white drop-shadow-sm" : "text-gray-500 hover:text-gray-800"}`}
                            >
                                Employee
                            </button>
                            <button
                                onClick={() => {
                                    setView("admin");
                                    setScannerActive(false);
                                    setStatusMessage("");
                                    setQrCodeSvg("");
                                }}
                                className={`flex-1 py-2.5 rounded-full text-sm font-bold transition-all duration-300 z-10 ${view === "admin" ? "text-white drop-shadow-sm" : "text-gray-500 hover:text-gray-800"}`}
                            >
                                HR Admin
                            </button>
                            {/* The Sliding Pill */}
                            <div
                                className={`absolute top-1.5 bottom-1.5 w-[calc(50%-6px)] bg-gradient-to-r from-brand-blue to-brand-green rounded-full transition-all duration-500 ease-out shadow-lg`}
                                style={{
                                    left:
                                        view === "employee"
                                            ? "6px"
                                            : "calc(50%)",
                                }}
                            ></div>
                        </div>

                        {/* API Token Input with Icon */}
                        <div className="mb-8 relative group">
                            <div className="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                <svg
                                    className="w-5 h-5 text-gray-400 group-focus-within:text-brand-blue transition-colors"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        strokeLinecap="round"
                                        strokeLinejoin="round"
                                        strokeWidth="2.5"
                                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
                                    ></path>
                                </svg>
                            </div>
                            <input
                                type="text"
                                value={token}
                                onChange={(e) => setToken(e.target.value)}
                                placeholder="Paste Secure Auth Token..."
                                className="w-full bg-white border-2 border-gray-100 text-gray-800 text-sm font-medium rounded-2xl focus:ring-4 focus:ring-brand-blue/10 focus:border-brand-blue block pl-12 p-4 transition-all outline-none shadow-sm"
                            />
                        </div>

                        {/* EMPLOYEE VIEW */}
                        {view === "employee" && (
                            <div className="animate-fade-in">
                                {/* Live Pinging GPS Badge */}
                                <div className="flex justify-center mb-6">
                                    {location ? (
                                        <div className="inline-flex items-center gap-2.5 bg-green-50 border border-green-200 text-brand-greenDark px-5 py-2.5 rounded-full text-xs font-extrabold shadow-sm">
                                            <span className="relative flex h-3 w-3">
                                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-green opacity-75"></span>
                                                <span className="relative inline-flex rounded-full h-3 w-3 bg-brand-green"></span>
                                            </span>
                                            GPS LINKED:{" "}
                                            {location.lat.toFixed(4)},{" "}
                                            {location.lng.toFixed(4)}
                                        </div>
                                    ) : (
                                        <div className="inline-flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-600 px-5 py-2.5 rounded-full text-xs font-bold shadow-sm animate-pulse">
                                            <span>⏳</span> Acquiring Satellite
                                            GPS...
                                        </div>
                                    )}
                                </div>

                                {/* Scanner or Buttons */}
                                {scannerActive ? (
                                    <div className="mb-2 animate-fade-in">
                                        <div
                                            id="reader"
                                            className="shadow-inner mb-4"
                                        ></div>
                                        <button
                                            onClick={() =>
                                                setScannerActive(false)
                                            }
                                            className="w-full bg-gray-100 text-gray-600 font-bold py-4 rounded-2xl hover:bg-gray-200 hover:text-gray-800 transition-colors"
                                        >
                                            Cancel Scanning
                                        </button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 gap-4">
                                        <button
                                            onClick={() =>
                                                startScanner("check-in")
                                            }
                                            disabled={loading || !location}
                                            className="group relative flex flex-col items-center justify-center bg-gradient-to-br from-brand-blue to-blue-500 text-white font-bold p-5 rounded-3xl shadow-lg shadow-brand-blue/30 hover:shadow-brand-blue/50 hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:hover:translate-y-0"
                                        >
                                            <svg
                                                className="w-8 h-8 mb-2 opacity-90 group-hover:scale-110 transition-transform duration-300"
                                                fill="none"
                                                stroke="currentColor"
                                                viewBox="0 0 24 24"
                                            >
                                                <path
                                                    strokeLinecap="round"
                                                    strokeLinejoin="round"
                                                    strokeWidth="2.5"
                                                    d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
                                                ></path>
                                            </svg>
                                            Check In
                                        </button>
                                        <button
                                            onClick={() =>
                                                startScanner("check-out")
                                            }
                                            disabled={loading || !location}
                                            className="group relative flex flex-col items-center justify-center bg-gradient-to-br from-brand-green to-emerald-400 text-white font-bold p-5 rounded-3xl shadow-lg shadow-brand-green/30 hover:shadow-brand-green/50 hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:hover:translate-y-0"
                                        >
                                            <svg
                                                className="w-8 h-8 mb-2 opacity-90 group-hover:scale-110 transition-transform duration-300"
                                                fill="none"
                                                stroke="currentColor"
                                                viewBox="0 0 24 24"
                                            >
                                                <path
                                                    strokeLinecap="round"
                                                    strokeLinejoin="round"
                                                    strokeWidth="2.5"
                                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                                                ></path>
                                            </svg>
                                            Check Out
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ADMIN VIEW */}
                        {view === "admin" && (
                            <div className="animate-fade-in text-center">
                                <p className="text-sm text-gray-500 font-medium mb-6 px-2">
                                    Generate the official Office QR Code. Print
                                    and place this at the office entrance.
                                </p>

                                <button
                                    onClick={fetchQrCode}
                                    disabled={loading}
                                    className="w-full bg-gradient-to-r from-gray-800 to-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg shadow-gray-900/20 hover:shadow-gray-900/40 hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 flex justify-center items-center gap-2"
                                >
                                    <svg
                                        className="w-5 h-5"
                                        fill="none"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                    >
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2.5"
                                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                                        ></path>
                                    </svg>
                                    {loading
                                        ? "Generating..."
                                        : "Generate Office QR"}
                                </button>

                                {qrCodeSvg && (
                                    <div className="mt-8 flex flex-col items-center animate-fade-in">
                                        <div className="bg-white p-3 rounded-[2rem] shadow-2xl shadow-brand-green/20 border border-gray-100">
                                            <div
                                                className="rounded-2xl overflow-hidden flex"
                                                dangerouslySetInnerHTML={{
                                                    __html: qrCodeSvg,
                                                }}
                                            />
                                        </div>
                                        <span className="mt-4 text-[10px] font-bold tracking-[0.2em] text-gray-400 uppercase">
                                            Ready for Print
                                        </span>
                                    </div>
                                )}
                            </div>
                        )}

                        <StatusBanner />
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(<AttendanceTester />);
        </script>
    </body>
</html>
